services:
  credit-card-manager:
    build: .
    image: credit-card-manager:1.0.0
    container_name: credit-card-manager
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # 必填：Owner 登录验证令牌（首次/管理登录）
      CCM_OWNER_TOKEN: replace_with_random_token_at_least_32_chars
      # 选填：公网反代域名（纯局域网访问留空或不填即可）
      CCM_ALLOWED_HOST: ""
      # 选填：时区，默认上海时区
      CCM_TIMEZONE: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
