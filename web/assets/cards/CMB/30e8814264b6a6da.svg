    <text x="0" y="24" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#e4e4e7" letter-spacing="2.5">••••  ••••  ••••  9492</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#a1a1aa" letter-spacing="1">YOUNG CARD BLACK</text>
