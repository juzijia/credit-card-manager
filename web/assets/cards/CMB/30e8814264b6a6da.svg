    <path d="M4 17 L4 6 L8 12 L11 6 L14 12 L18 6 L18 17" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">招商银行</text>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="500" fill="#a1a1aa" letter-spacing="0.4">CHINA MERCHANTS BANK</text>
  </g>

